spring:
  datasource:
    url: jdbc:h2:mem:needs-shop-test-${random.uuid};MODE=MySQL;DATABASE_TO_LOWER=TRUE;LOCK_TIMEOUT=20000;DB_CLOSE_DELAY=-1
  jpa:
    properties:
      hibernate:
        generate_statistics: true

logging:
  level:
    org.hibernate.engine.internal.StatisticalLoggingSessionEventListener: WARN
    com.needsshop: WARN

needsshop:
  scheduler:
    enabled: false        # 테스트에서는 스케줄러를 직접 호출해서 결정적으로 검증한다
  seed:
    enabled: false
  pg:
    read-timeout: 1s
  payment:
    reconcile-grace: 0s
  ai:
    api-key: ""           # 테스트는 실제 Gemini를 호출하지 않는다
  popular:
    cache-ttl: 0s         # 인기 배지 집계를 매번 새로 한다 (운영은 30초 캐시). 테스트가 주문을 만들고 바로 배지를 확인할 수 있게
